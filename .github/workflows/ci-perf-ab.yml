name: CI In-Job A/B Performance Benchmark

on:
  push:
    branches:
      - perf/predict-latency-optimization
  pull_request:
    branches:
      - main
      - feat/container-benchmarks-cicd

permissions:
  contents: read

jobs:
  ab-benchmark:
    name: Alternating A/B Container Benchmark
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout PR Branch (Optimized)
        uses: actions/checkout@v4
        with:
          path: optimized-repo

      - name: Inspect Runner Hardware Environment
        run: |
          echo "Logical CPUs (nproc): $(nproc)"
          echo "System Memory (free -m):"
          free -m

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          cd optimized-repo
          python -m pip install --upgrade pip
          pip install -e ".[dev,test]"
          pip install locust

      - name: Bootstrap Production Model Artifacts
        run: |
          cd optimized-repo
          python scripts/bootstrap_model.py
          mkdir -p reports/ab_load
          # Set runtime mount permissions for appuser (UID 10001)
          sudo chown -R 10001:10001 models mlruns mlflow.db || true

      - name: Run Unit Test Suite
        run: |
          cd optimized-repo
          python -m pytest tests/unit/ -v

      - name: Build Optimized Docker Image
        run: |
          cd optimized-repo
          docker build -t telco-api-optimized:latest .

      - name: Checkout Main Branch for Baseline Image
        uses: actions/checkout@v4
        with:
          ref: main
          path: baseline-repo

      - name: Build Baseline Docker Image
        run: |
          cd baseline-repo
          # pyproject in main has pandas unpinned, so pin it during build if needed or build directly
          docker build -t telco-api-baseline:latest .

      - name: Execute Alternating A/B Locust Benchmark (3 Rounds)
        run: |
          cd optimized-repo
          TEST_API_KEY=$(openssl rand -hex 16)
          export API_KEY="$TEST_API_KEY"
          SHARED_DIR="$(pwd)"

          run_container() {
            local img="$1"
            echo "Starting container for $img..."
            docker run -d \
              --name ab-test-container \
              -p 8000:8000 \
              -e ENVIRONMENT=development \
              -e API_HOST=0.0.0.0 \
              -e API_PORT=8000 \
              -e API_SECRET_KEYS="[\"${TEST_API_KEY}\"]" \
              -e MLFLOW_TRACKING_URI=sqlite:////app/mlflow.db \
              -e MLFLOW_MODEL_NAME=telco-churn-classifier \
              -v "${SHARED_DIR}:/app_host:ro" \
              -v "${SHARED_DIR}/models:/app/models:ro" \
              -v "${SHARED_DIR}/mlruns:/app/mlruns:ro" \
              -v "${SHARED_DIR}/mlflow.db:/app/mlflow.db:rw" \
              "$img"

            for i in {1..30}; do
              if curl -s -f http://localhost:8000/health/readiness > /dev/null; then
                echo "$img is ready (attempt $i)."
                return 0
              fi
              sleep 1
            done
            echo "FAILED readiness check for $img"
            docker logs ab-test-container
            exit 1
          }

          stop_container() {
            docker stop ab-test-container || true
            docker rm ab-test-container || true
          }

          echo "Warmup Phase (both variants)..."
          run_container "telco-api-baseline:latest"
          locust -f tests/load/locustfile.py --headless -u 5 -r 5 --run-time 10s --host http://localhost:8000 --exit-code-on-error 0
          stop_container

          run_container "telco-api-optimized:latest"
          locust -f tests/load/locustfile.py --headless -u 5 -r 5 --run-time 10s --host http://localhost:8000 --exit-code-on-error 0
          stop_container

          for r in 1 2 3; do
            echo "=========================================================="
            echo ">>> ROUND $r: Baseline Image"
            echo "=========================================================="
            run_container "telco-api-baseline:latest"
            locust -f tests/load/locustfile.py --headless -u 1 -r 1 --run-time 30s --host http://localhost:8000 --csv="reports/ab_load/baseline_u1_r${r}" --exit-code-on-error 0
            locust -f tests/load/locustfile.py --headless -u 5 -r 5 --run-time 30s --host http://localhost:8000 --csv="reports/ab_load/baseline_u5_r${r}" --exit-code-on-error 0
            locust -f tests/load/locustfile.py --headless -u 25 -r 5 --run-time 30s --host http://localhost:8000 --csv="reports/ab_load/baseline_u25_r${r}" --exit-code-on-error 0
            stop_container

            echo "=========================================================="
            echo ">>> ROUND $r: Optimized Image"
            echo "=========================================================="
            run_container "telco-api-optimized:latest"
            locust -f tests/load/locustfile.py --headless -u 1 -r 1 --run-time 30s --host http://localhost:8000 --csv="reports/ab_load/optimized_u1_r${r}" --exit-code-on-error 0
            locust -f tests/load/locustfile.py --headless -u 5 -r 5 --run-time 30s --host http://localhost:8000 --csv="reports/ab_load/optimized_u5_r${r}" --exit-code-on-error 0
            locust -f tests/load/locustfile.py --headless -u 25 -r 5 --run-time 30s --host http://localhost:8000 --csv="reports/ab_load/optimized_u25_r${r}" --exit-code-on-error 0
            stop_container
          done

      - name: Parse A/B Benchmark Results & Generate Job Summary
        run: |
          cd optimized-repo
          python scripts/compare_ab_benchmarks.py \
            --dir reports/ab_load \
            --output-json reports/ab_load/ab_comparison_summary.json \
            --step-summary "$GITHUB_STEP_SUMMARY"

      - name: Upload A/B Benchmark Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ab-benchmark-results
          path: optimized-repo/reports/ab_load/
