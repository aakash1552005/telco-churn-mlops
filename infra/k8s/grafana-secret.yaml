# ==============================================================================
# Phase 16 — Grafana Secret (TEMPLATE / LOCAL DEV ONLY)
#
# !! THIS FILE CONTAINS DEVELOPMENT PLACEHOLDER VALUES FOR LOCAL MINIKUBE !!
# !! NEVER COMMIT REAL PRODUCTION SECRETS TO GIT !!
#
# The base64-encoded values below decode to development defaults:
#   admin-user     →  admin
#   admin-password →  dev-grafana-password-placeholder
#
# ---
# HOW TO CREATE THE REAL SECRET AT DEPLOY TIME
# ---
# In production or hardened environments, create the secret imperatively:
#
#   kubectl create secret generic grafana-secret \
#     --from-literal=admin-user='admin' \
#     --from-literal=admin-password='your-actual-secure-password' \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# To verify the secret exists (without revealing its value):
#   kubectl get secret grafana-secret
#   kubectl describe secret grafana-secret
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: grafana-secret
  namespace: default
  labels:
    app: grafana
    phase: "16"
type: Opaque
# Placeholder base64 values:
#   admin-user: admin (YWRtaW4=)
#   admin-password: dev-grafana-password-placeholder (ZGV2LWdyYWZhbmEtcGFzc3dvcmQtcGxhY2Vob2xkZXI=)
# Generate custom values with: echo -n 'your-password' | base64
data:
  admin-user: YWRtaW4=
  admin-password: ZGV2LWdyYWZhbmEtcGFzc3dvcmQtcGxhY2Vob2xkZXI=
