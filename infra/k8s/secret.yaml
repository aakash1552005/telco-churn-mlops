# ==============================================================================
# Phase 13 — Kubernetes Secret (TEMPLATE ONLY)
#
# !! THIS FILE CONTAINS ONLY PLACEHOLDER VALUES !!
# !! NEVER COMMIT REAL SECRETS TO GIT !!
#
# The base64-encoded values below decode to obvious placeholders:
#   API_SECRET_KEYS  →  ["REPLACE_WITH_REAL_KEY"]
#
# ---
# HOW TO CREATE THE REAL SECRET AT DEPLOY TIME
# ---
# DO NOT apply this file as-is in production. Instead, create the real secret
# imperatively so the actual value never touches the filesystem or git:
#
#   kubectl create secret generic telco-churn-secret \
#     --from-literal=API_SECRET_KEYS='["your-actual-api-key-here"]' \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# To update a key without recreating from scratch:
#   kubectl patch secret telco-churn-secret \
#     -p '{"stringData": {"API_SECRET_KEYS": "[\"new-key\"]"}}'
#
# To verify the secret exists (without revealing its value):
#   kubectl get secret telco-churn-secret
#   kubectl describe secret telco-churn-secret
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: telco-churn-secret
  namespace: default
  labels:
    app: telco-churn-api
    phase: "13"
type: Opaque
# Placeholder base64 value: ["REPLACE_WITH_REAL_KEY"]
# Generate real value with: echo -n '["your-actual-key"]' | base64
data:
  API_SECRET_KEYS: WyJSRVBMQUNFX1dJVEhfUkVBTF9LRVkiXQ==
